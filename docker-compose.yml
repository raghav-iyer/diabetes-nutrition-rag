# Local stack: AlloyDB Omni (Postgres-compatible, ships pgvector + ScaNN) and the app.
# Start the database:   docker compose up -d db
# Run a CLI command:    docker compose run --rm app ingest --max-per-topic 50
services:
  db:
    # Pinned 2026-10-22: PostgreSQL 16.14, pgvector 0.8.5, alloydb_scann 0.1.4 (arm64 build is a preview).
    image: google/alloydbomni@sha256:6f9f2a87354dac2eed5e3a84fb1e6ccfce0429d4176623a3396a6012e6fc5e47
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: nrag
    ports:
      - "127.0.0.1:5432:5432"      # local only
    volumes:
      - alloydb-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      retries: 20

  app:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@db:5432/nrag
    volumes:
      - ./data:/app/data
      - ./eval:/app/eval
    depends_on:
      db:
        condition: service_healthy

volumes:
  alloydb-data:
