# All tunable numbers live here. Every change to the `pubmed` or `design`
# sections alters the corpus, so commit config changes with a clear message.
#
# Phase 0 reproduced legacy/ingest_pubmed.py exactly. Phase 1 deliberately
# changed behaviour; see CLAUDE.md "Changes from the legacy script".

paths:
  cache_dir: data/cache
  pubmed_records: data/interim/pubmed_records.jsonl   # every fetched record, parsed (refreshed each run)
  documents: data/corpus/documents.jsonl
  excluded: data/corpus/excluded.jsonl
  removals_log: data/corpus/removals_log.jsonl        # docs that left the corpus, appended per run
  summary: data/corpus/summary.json
  fulltext_dir: data/corpus/fulltext
  guidelines_dir: data/guidelines
  guidelines_registry: data/guidelines/registry.yaml

ncbi:
  eutils_base: https://eutils.ncbi.nlm.nih.gov/entrez/eutils
  tool: nutrition_rag_ingest
  delay_no_key_s: 0.34      # 3 req/s without an API key
  delay_with_key_s: 0.11    # 10 req/s with NCBI_API_KEY
  timeout_s: 60
  retries: 4                # exponential backoff 1, 2, 4 ... seconds
  efetch_batch: 200
  esearch_max_ids: 10000    # PubMed's hard cap per search

cache:
  # Days before a cached response is refetched. null = never expires.
  esearch_ttl_days: 1       # searches change daily; same-day reruns are free
  efetch_ttl_days: 7        # every stored record is refetched at most weekly (retractions, MeSH, EoC)

pubmed:
  date_range: ["2013/01/01", "3000/12/31"]   # "post 2012"; searches are split by year
  sort: pub_date
  # Apply `strong_designs` at search time. Only an efficiency filter: the
  # credibility rules below decide inclusion. Turn off to measure what it misses.
  design_filter: true
  # Extra India / South Asia searches per topic, broader than the topic queries
  # (India-specific evidence is ~3% of the main results). In sample runs the boost
  # fetches `fraction` x max_per_topic extra records per topic; in full runs, all hits.
  # Target: ~30% more *documents*. About half of India-boost records pass the
  # credibility rules (many are retrospective or cross-sectional), hence 0.45.
  india_boost:
    enabled: true
    fraction: 0.45
    region: '(India[mh] OR India*[tiab] OR "South Asian*"[tiab] OR "Asian Indian*"[tiab] OR Bangladesh*[tiab] OR Pakistan*[tiab] OR "Sri Lanka*"[tiab] OR Nepal*[tiab])'
    diet: '(diet[mh] OR "dietary supplements"[mh] OR "feeding behavior"[mh] OR diet*[tiab] OR food*[tiab] OR nutrition*[tiab] OR millet*[tiab] OR pulses[tiab] OR legume*[tiab] OR rice[tiab] OR ghee[tiab] OR yoga[tiab] OR "lifestyle intervention"[tiab])'
    outcomes:
      diabetes_prevention: '(prediabetic state[mh] OR prediabet*[tiab] OR "diabetes mellitus, type 2"[mh] OR "insulin resistance"[mh])'
      weight_management: '(obesity[mh] OR overweight[mh] OR "weight loss"[mh] OR "body weight"[mh] OR "body mass index"[mh] OR adiposity[tiab])'
      maternal_nutrition: '(pregnancy[mh] OR "pregnant women"[mh] OR lactation[mh] OR "breast feeding"[mh] OR "maternal nutrition"[tiab] OR anemia[mh] OR "gestational weight gain"[mh])'
      gestational_diabetes: '("diabetes, gestational"[mh] OR "gestational diabetes"[tiab])'
  base_filters: 'humans[mh] AND english[la] AND hasabstract'
  strong_designs: >-
    (randomized controlled trial[pt] OR meta-analysis[pt] OR systematic review[pt]
    OR practice guideline[pt] OR guideline[pt] OR cohort studies[mh])
  topics:
    diabetes_prevention: >-
      ("diabetes mellitus, type 2/prevention and control"[mh] OR prediabetic state[mh]
      OR prediabetes[tiab]) AND (diet[mh] OR "feeding behavior"[mh] OR "dietary pattern*"[tiab]
      OR "lifestyle intervention"[tiab])
    weight_management: >-
      ("weight loss"[mh] OR "obesity/diet therapy"[mh] OR "weight maintenance"[tiab])
      AND (diet[mh] OR "diet, reducing"[mh] OR "dietary pattern*"[tiab] OR "eating behavio*"[tiab])
    maternal_nutrition: >-
      (pregnancy[mh] OR "pregnant women"[mh] OR "prenatal nutritional physiological phenomena"[mh]
      OR "lactation"[mh]) AND (diet[mh] OR "dietary supplements"[mh] OR "maternal nutrition"[tiab]
      OR "gestational weight gain"[mh])
    gestational_diabetes: >-
      "diabetes, gestational"[mh] AND (diet[mh] OR "diet therapy"[sh] OR "dietary pattern*"[tiab]
      OR prevention and control[sh])

design:
  # Checked in order against PubMed publication types; first match wins.
  # `defer: true` means "only use this if MeSH and text rules find nothing".
  pubtype_rules:
    - {label: guideline, score: 1.00, pub_types: ["Practice Guideline", "Guideline", "Consensus Development Conference"]}
    - {label: meta_analysis, score: 0.90, pub_types: ["Meta-Analysis"]}
    - {label: systematic_review, score: 0.85, pub_types: ["Systematic Review"]}
    - {label: rct, score: 0.75, pub_types: ["Randomized Controlled Trial"]}
    - {label: controlled_trial, score: 0.60, pub_types: ["Controlled Clinical Trial", "Clinical Trial", "Clinical Trial, Phase III", "Clinical Trial, Phase IV", "Pragmatic Clinical Trial"]}
    - {label: observational, score: 0.45, pub_types: ["Observational Study"], defer: true}
    - {label: narrative_review, score: 0.15, pub_types: ["Review"], defer: true}
    - {label: opinion, score: 0.05, pub_types: ["Editorial", "Comment", "Letter", "News"]}
  mesh_rules:
    # Case-control and cross-sectional come before the generic cohort rule: case-control
    # studies are nearly always also indexed "Retrospective Studies".
    - {label: prospective_cohort, score: 0.55, mesh: ["Prospective Studies"]}
    - {label: case_control, score: 0.40, mesh: ["Case-Control Studies"]}
    - {label: cross_sectional, score: 0.30, mesh: ["Cross-Sectional Studies"]}
    - {label: cohort, score: 0.55, mesh: ["Cohort Studies", "Longitudinal Studies", "Retrospective Studies"]}
  # Case-insensitive regexes over title + abstract, used when the above find nothing.
  text_rules:
    - {label: meta_analysis, score: 0.90, pattern: '\bmeta-?analys[ie]s\b'}
    - {label: systematic_review, score: 0.85, pattern: '\bsystematic(ally)? review'}
    - {label: rct, score: 0.75, pattern: '\brandomi[sz]ed\b.{0,40}\btrial\b'}
    - {label: prospective_cohort, score: 0.55, pattern: '\bprospective(ly)?\b.{0,40}\bcohort\b'}
    - {label: cohort, score: 0.55, pattern: '\b(retrospective\s+)?cohort\b'}
    - {label: case_control, score: 0.40, pattern: '\bcase-?control\b'}
    - {label: cross_sectional, score: 0.30, pattern: '\bcross-?sectional\b'}
  # Text rules ignore background sections and sentences about prior work.
  text_scope:
    background_labels: '^(background|introduction|context|rationale|importance)'
    prior_work_cues: '\b(previous(ly)?|prior|earlier|existing|past)\b|\b(have|has) (been )?(shown|suggested|reported|found|demonstrated)\b|\bremains? (unclear|controversial|uncertain)\b'
  unknown_score: 0.20

sample_size:
  patterns:
    - '\b[nN]\s*=\s*([\d,]{2,9})'
    - '\b([\d,]{2,9})\s+(?:participants|subjects|adults|women|men|patients|pregnant women|individuals|people|children|mothers)\b'
  min: 5
  max: 50000000
  skip_range: [1900, 2100]   # numbers that look like years...
  # ...when preceded by a date-like context ("in 2015 women", "between 2012 and 2014 participants")
  year_context: '(\b(in|since|from|during|until|by|before|after)\s+|\bbetween\s+\d{4}\s+and\s+|\b\d{4}\s*(-|–|to)\s*)$'

exclusion:
  min_abstract_chars: 200
  notice_pub_types: ["Retracted Publication", "Retraction of Publication", "Published Erratum", "Expression of Concern"]
  required_mesh: Humans      # only enforced when the record has MeSH terms
  language: eng
  excluded_designs: [opinion]

scoring:
  size:
    exempt_designs: [guideline, meta_analysis, systematic_review, narrative_review, opinion]
    unknown_n: 0.85
    # [upper bound (exclusive), factor]; n at or above the last bound gets `large`.
    bands: [[50, 0.60], [200, 0.80], [1000, 0.90]]
    large: 1.00
  recency:
    half_life_years: 10.0
    floor: 0.6
    reference_year: null     # null = current calendar year
  expression_of_concern_multiplier: 0.5

# Fixed population vocabulary (registry entries, Phase 2 extraction).
population_tags: [general_adults, prediabetes, type2_diabetes, overweight_obese, pregnant, lactating,
                  gestational_diabetes, south_asian, indian, children, older_adults]

# What counts as "extremely credible". Applied after the hygiene filters above.
credibility:
  include_designs: [guideline, meta_analysis, systematic_review, rct, prospective_cohort]
  min_n: {rct: 50, prospective_cohort: 1000}
  unknown_n: provisional            # provisional | include | exclude (Phase 2 extraction resolves provisional)
  trusted_design_methods: [pubtype, mesh]   # a text-only design match makes the record provisional
  exclude_pub_types: ["Clinical Trial Protocol", "Preprint"]
  require_medline_journal: true     # citation indexed for MEDLINE, or journal currently indexed (NLM Catalog)
  exclude_expression_of_concern: true
  min_year: 2013                    # guidelines in the registry are exempt while current

journals:
  nlmcatalog_batch: 100
  ttl_days: 30

retractions:
  # Crossref's distribution of the Retraction Watch database (updated daily).
  retraction_watch_csv: https://gitlab.com/crossref/retraction-watch-data/-/raw/main/retraction_watch.csv
  ttl_days: 1

pmc:
  enabled: true
  efetch_batch: 20
  ttl_days: 90
  allowed_licences: [CC-BY, CC-BY-SA, CC0]
  # Section titles are matched (lowercase, substring) in this order.
  section_map:
    introduction: [introduction, background]
    methods: [method, materials, design, participants, population, statistical, procedure, setting, intervention]
    results: [result, finding]
    discussion: [discussion]
    conclusion: [conclusion]
  skip_sec_types: [supplementary-material, COI-statement, author-contributions, data-availability,
                   ai-statement, disclaimer, funding-information, ethics-statement, abbreviations]
  skip_titles: [acknowledg, funding, conflict, competing interest, author contribution, data availability,
                abbreviation, supplementary, ethics, declaration, publisher]

guidelines:
  heading_size_ratio: 1.15          # a line is a heading if its font is this much larger than body text
  heading_max_chars: 120
  min_section_chars: 40
  # Named regexes for recommendation grades. Each needs groups `text` and `grade`.
  grade_patterns:
    # ADA: "5.1 Refer adults with ... program. A" (several may share a paragraph)
    ada: '(?P<text>\b\d{1,2}\.\d{1,2}[a-z]?\s.{20,}?)\s(?P<grade>[ABCE])(?=\s+\d{1,2}\.\d{1,2}[a-z]?\s|\s*$)'
    grade_system: '(?i)(?P<text>.{20,}?)\s*[(\[]?(?P<grade>(?:strong|weak|conditional) recommendation[^.;)\]]*)'
    who: '(?i)(?P<text>.{20,}?)\s*[(\[]?(?P<grade>context-specific recommendation|not recommended|recommended only in the context of rigorous research|recommended)\s*[)\]]?\s*$'

# LLM providers. Endpoint URLs can come from env vars (kept in .env, not committed).
llm:
  providers:
    local:                        # Ollama on this Mac
      backend: ollama
      endpoints: ["http://localhost:11434"]
      endpoints_env: LLM_ENDPOINTS
      concurrency_per_endpoint: 1
    remote:                       # OpenAI-compatible server (vLLM); base URL without /v1
      backend: openai_compat
      endpoints: []
      endpoints_env: LLM_REMOTE_ENDPOINTS
      concurrency_per_endpoint: 4
  timeout_s: 900
  retries: 3
  temperature: 0
  seed: 0
  num_ctx: 8192                   # Ollama only
  keep_alive: 30m                 # Ollama only
  max_consecutive_failures: 5     # abort a run when the model server keeps erroring (e.g. GPU out of memory)

extract:
  active_model: gpt-oss:20b       # overridden by LLM_MODEL; feeds the corpus once validated
  # qwen3.8:27b is the MLX (NVFP4) build: GPU-only, so it ran out of memory on the 24 GB Mac.
  # qwen3.8:27b-q4_K_M is the llama.cpp (GGUF) build, which can offload layers to the CPU.
  # High reasoning on gpt-oss was ~4 min/abstract (measured on 4), so only low is used.
  candidates: [/models/gemma-4-26B-A4B-it, qwen3.8:27b-q4_K_M, gpt-oss:20b]
  provider:                       # which llm.providers entry serves each model
    default: local
    /models/gemma-4-26B-A4B-it: remote
  think:                          # per-model reasoning setting (gpt-oss: low|medium|high; qwen3.8: false|low|medium|xhigh)
    gpt-oss:20b: low
    qwen3.8:27b: false
    qwen3.8:27b-q4_K_M: low
  # schema = constrained decoding via the backend; prompt = schema in the prompt, validated afterwards.
  # Measured 2026-10-16 on 6 abstracts: constrained decoding made gpt-oss answer effect_direction
  # "mixed" and funding_industry "no" on 6/6 (100-doc run: 68% mixed, 97% "no"); prompted JSON gave
  # varied, abstract-consistent answers with the same validity (6/6 first attempt) and speed.
  output_mode:
    default: prompt
    qwen3.8:27b: prompt   # Ollama: "structured output is unavailable" for this engine
  prompt_version: pico_v1
  max_attempts: 3
  max_tokens: 8192                # thinking tokens count toward this; high effort needs headroom
  dropout_threshold_pct: 20
  output_dir: data/interim/extractions
  apply_to_corpus: false          # switch on after the review shows acceptable accuracy
  sample: {screen: 30, review: 100, seed: 13}
  review_csv: eval/extraction_review.csv
  review_key: eval/extraction_review_key.json
  report: eval/reports/extraction_accuracy.md
  # Pre-registered model choice: prefer the faster model unless it is worse on these
  # fields by more than max_accuracy_drop with a 95% CI excluding zero.
  decision:
    critical_fields: [population.tags, effect_direction, outcomes, sample_size]
    max_accuracy_drop: 0.05
  bootstrap_iters: 2000
  # Rules-only baseline (no LLM): MeSH terms -> population tags.
  rules_baseline_mesh_tags:
    pregnant: [Pregnancy, Pregnant Women, Pregnant People]
    lactating: [Lactation, Breast Feeding]
    gestational_diabetes: ["Diabetes, Gestational"]
    prediabetes: [Prediabetic State]
    type2_diabetes: ["Diabetes Mellitus, Type 2"]
    overweight_obese: [Obesity, Overweight, "Obesity, Morbid", "Pediatric Obesity"]
    indian: [India]
    south_asian: [India, Pakistan, Bangladesh, Sri Lanka, Nepal]
    children: [Child, Adolescent, "Child, Preschool"]
    older_adults: [Aged, "Aged, 80 and over"]
